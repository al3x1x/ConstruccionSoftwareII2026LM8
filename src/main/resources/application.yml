spring:
  application:
    name: bank-system

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:sqlserver://localhost\SQLEXPRESS:1433;databaseName=BankDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: Admin123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        show_sql: false
    show-sql: false
    database-platform: org.hibernate.dialect.SQLServerDialect

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/bank_db}

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: mappings

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-change-this-in-production-at-least-32-characters-long}
    expiration: 86400000
